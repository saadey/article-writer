# ============================================================
#  Starter project
#  On the app's first launch (python app.py) this file becomes your
#  first project. After that, change settings in the app: this file
#  is not read again. You can also create a project from a file like
#  this one with:  python main.py import-config my-niche.yaml
# ============================================================

niche:
  name: "My first project"

# ---- Step 1: YouTube search -----------------------------------
search:
  # Each keyword is one YouTube search. Each search costs 100 quota
  # units per page of 50 results (free quota: 10,000 units/day).
  # These are examples: replace them with your own niche in the app's Settings.
  keywords:
    - "how to learn faster"
    - "how to build better habits"
    - "how to focus deeply"

  # Results to request per keyword (1-200). Above 50 uses extra pages
  # and extra quota.
  max_results_per_keyword: 25

  # relevance | date | viewCount | rating
  order: relevance

  # Optional: bias results toward a language / country. Use null to disable.
  relevance_language: en
  region_code: US

  # none | moderate | strict
  safe_search: moderate

# ---- Filters applied to search results ------------------------
filters:
  min_views: 10000
  max_age_days: 365            # only videos published in the last N days
  min_duration_minutes: 8      # skip Shorts and very short clips
  max_duration_minutes: 60     # skip very long streams/podcasts
  # Skip videos whose title contains any of these (case-insensitive).
  exclude_title_words:
    - "#shorts"
    - "live stream"
  # Skip these channels (channel name or channel ID).
  exclude_channels: []
  # Upper limit of new videos processed per run (highest views first).
  max_videos_per_run: 10

# ---- Step 2: Transcripts --------------------------------------
transcripts:
  # Preferred transcript languages, in priority order.
  languages: ["en"]
  # Allow YouTube's auto-generated captions (most videos only have these).
  allow_auto_generated: true
  # If no transcript exists in `languages`, translate another one into
  # the first language in the list.
  translate_if_missing: false
  # Treat transcripts shorter than this as failed (not enough material).
  min_words: 400
  # Pause between transcript requests to avoid being rate limited.
  delay_seconds: 2

# ---- Step 3: Article writing (Gemini) -------------------------
writing:
  # Free-tier Gemini models: https://ai.google.dev/gemini-api/docs/pricing
  model: gemini-3.8-flash
  # Tried in order when a model hits its free daily limit or is unavailable.
  fallback_models:
    - gemini-3.6-flash
    - gemini-3.5-flash-lite

  # Who you write for. Added to the instructions; leave "" to skip.
  audience: "Curious, thoughtful readers who want practical ideas explained clearly"
  # Leave "" when your instructions file already describes the tone.
  tone: ""
  target_word_count: 1200

  # Starting instructions for the AI writer (edit them later on the app's Prompts page).
  instructions_file: prompts/article_instructions.md

  # true adds an "Inspired by <video> by <channel>" line at the end of each article.
  # The source link is always kept in editor_notes.md and metadata.json either way.
  include_source_credit: false
  # 0 = predictable, 1+ = more creative.
  temperature: 0.8
  # Pause between articles to stay under the free per-minute limit.
  delay_seconds: 5
  # Free tier has a small daily request limit; keep runs modest.
  max_articles_per_run: 10

# ---- Step 4: Image prompts (Gemini) ---------------------------
# Writes image_prompts.md in each draft folder: prompts you paste into an
# image tool (ChatGPT, Gemini, Midjourney, ...). Uses the writing models.
images:
  # Edit this file to change the image style and rules.
  instructions_file: prompts/image_instructions.md
  # How many prompts per article. The first is always the header/thumbnail.
  count: 3
  # Width:height. 16:9 suits most post headers and social previews.
  aspect_ratio: "16:9"
  temperature: 1.0
